<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Audax Data Manager</title>
    <style type="text/css">
      ::-webkit-scrollbar {
        width: 5px;
        background-color: rgba(116, 125, 141, 0.2);
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(116, 125, 141, 0.3);
        border-radius: 5px;
      }

      .hidden {
        display: none;
      }

      html, body {
        display: block;
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
        font-weight: 400;
        line-height: 1.5;
        overflow: hidden;
        background-color: #FFFFFF;
      }

      #loading_interface {
        position: absolute;
        color: #16171E;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(to right, #16171E, #1560AD, rgba(21, 96, 173, 0.5));
      }

      .pgmanage__splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        opacity: 0;

        animation: fadeIn 0.3s linear forwards 0s;
      }

      .pgmanage__splash_wrapper {
        display: flex;
        flex-direction: column;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        background-color: #FFFFFF;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        box-sizing: border-box;
      }

      .splash__header {
        position: relative;
        padding: 16px 0 20px 20px;
      }

      .splash__header::after {
        content : '';
        display: block;
        background: linear-gradient(to right, #90949A, transparent);
        height: 1px;
        width: 0;
        left: 20px;
        position: absolute;
        margin-top: 6px;
        animation: growWidth 0.6s linear forwards 1.9s;
      }

      .splash__header_version {
        font-size: 12px;
        color: #4a6480;
        position: absolute;
        right: 20px;
        bottom: 24px;
        opacity: 0;
        animation: fadeIn 0.6s linear forwards 2.4s;
      }

      .splash__body {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .splash__body_wrapper {
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 0 20px;
        margin-top: 10px;
        background-color: #FFFFFF;
        transition: 0.45s;
        opacity: 0;

        animation: fadeIn 0.6s linear forwards 1.8s;
      }

      .stages {
        font-size: 12px;
        color: #4a6480;
        margin-top: 20px;
      }

      .stages__item {
        opacity: 0;
        transform: translateY(-100%);

        animation: textChangingAnimation 0.25s ease forwards;
      }

      .stages__item_title {
        margin: 0;
      }

      .stages__item_description {
        margin: 0;
        font-size: 12px;
        color: #4a6480;
      }

      .splash__footer {
        margin-top: auto;
      }

      .splash__footer_button {
        display: flex;
        justify-content: center;
        padding: 10px;
        background-color: rgba(116, 125, 141, 0.05);
      }

      .splash__footer_button:hover {
        background-color: rgba(116, 125, 141, 0.1);
        transition: all 0.15s linear;
      }

      .splash__footer_button::before {
        border-style: solid;
        border-width: 2px 2px 0 0;
        content: '';
        display: inline-block;
        width: 0.45em;
        height: 0.45em;
        position: relative;
        transform: rotate(135deg);
        vertical-align: top;
        transition: all 0.15s linear;
        bottom: 2px;
      }

      .splash__output {
        max-height: 0;
        overflow-y: auto;
        opacity: 0;
        transition: opacity 0.15s linear 0.15s;
        padding: 0 20px;
      }

      .splash__output.opened {
        max-height: 120px;
        opacity: 1;
      }

      .splash__output.opened + .splash__footer_button:before {
        transform: rotate(315deg);
      }

      .splash__output_text {
        font-size: 12px;
        color: #4a6480;
        margin: 0;
      }

      .splash__output_text:last-of-type {
        padding-bottom: 10px;
      }

      /* Animated Logo audax styles */
      #wordmark_audax path {
        fill-opacity: 0;
        stroke: #1560ad;
        stroke-width: 0.5px;

        stroke-dasharray: 100;
        stroke-dashoffset: 100;

        animation: svgDrawStrokes 1s linear forwards 0.3s,
          fadeInInfill 0.6s linear forwards 1.3s,
          svgFadeStrokes 0.6s linear forwards 1.3s;
      }

      #wordmark_data path,
      #wordmark_manager path {
        fill-opacity: 0;
        animation: fadeInInfillMuted 0.5s linear forwards 0.3s;
      }

      #wordmark_divider {
        fill-opacity: 0;
        animation: fadeInInfillMuted 0.5s linear forwards 0.3s;
      }
      .loading-dots {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .loading-dots .dot {
        width: 11px;
        height: 11px;
        margin: 0 7px;
        border-radius: 50%;
        background: #f29221;
        animation: dotBounce 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .loading-dots .dot:nth-child(1) {
        animation-delay: 0s;
      }
      .loading-dots .dot:nth-child(2) {
        animation-delay: 0.12s;
      }
      .loading-dots .dot:nth-child(3) {
        animation-delay: 0.24s;
      }
      .loading-dots .dot:nth-child(4) {
        animation-delay: 0.36s;
      }
      .loading-dots .dot:nth-child(5) {
        animation-delay: 0.48s;
      }

      @keyframes dotBounce {
        0%, 60%, 100% {
          transform: scale(0.75) translateY(0);
          box-shadow: 0 2px 3px rgba(242, 146, 33, 0.25);
        }
        30% {
          transform: scale(1.15) translateY(-9px);
          box-shadow: 0 14px 10px -4px rgba(242, 146, 33, 0.4);
        }
      }

      @keyframes svgDrawStrokes {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes svgFadeStrokes {
        to {
          stroke: transparent;
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInInfill {
        to {
          fill-opacity: 1;
        }
      }

      @keyframes fadeInInfillMuted {
        to {
          fill-opacity: 0.6;
        }
      }

      @keyframes growInFromTop {
        to {
          height: 400px;
          overflow-y: auto;
        }
      }

      @keyframes growWidth {
        to {
          width: 75%;
        }
      }

      @keyframes textChangingAnimation {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

          </style>
  </head>

    <script>
    (async function () {
      const titleEl = document.getElementById('stages_item_title');
      const descEl = document.getElementById('stages_item_description');
      const stagesContainer = document.getElementById('stages_container');
      const outputContainer = document.getElementById('output_container');
      const openMore = document.getElementById('open_more');
      const SPLASH = { width: 600, height: 280, openedHeight: 360 };

      Neutralino.init();
      // Closing the splash while the application is still starting means the user gave up.
      Neutralino.events.on('windowClose', () => Neutralino.app.exit());

      // The window starts hidden (config); make it a fixed-size, centred, borderless splash.
      const setSplashSize = (height) => Neutralino.window.setSize({ width: SPLASH.width, height, minWidth: SPLASH.width, minHeight: height, resizable: false });
      await setSplashSize(SPLASH.height);
      await Neutralino.window.setBorderless(true);
      // The window manager ignores the position of a hidden window, so it is moved once shown.
      await Neutralino.window.show();
      const display = (await Neutralino.computer.getDisplays())[0];
      if (display) {
        await Neutralino.window.move(Math.round((display.resolution.width - SPLASH.width) / 2), Math.round((display.resolution.height - SPLASH.height) / 2));
      }

      function addOutput(text) {
        const p = document.createElement('p');
        p.className = 'splash__output_text';
        p.textContent = text;
        outputContainer.appendChild(p);
      }

      function onLine(stream, line) {
        if (line === '') return;
        if (stream === 'stderr') { addOutput(line); return; }
        if (line.substring(0, 4) === 'http') {
          descEl.textContent = '';
          titleEl.textContent = 'Opening Audax Data Manager...';
          return;
        }
        addOutput(line);
        descEl.textContent = '';
        if (line.startsWith(' ')) descEl.textContent = line; else titleEl.textContent = line;
      }

      openMore.addEventListener('click', () => {
        outputContainer.classList.toggle('opened');
        stagesContainer.classList.toggle('hidden');
        setSplashSize(outputContainer.classList.contains('opened') ? SPLASH.openedHeight : SPLASH.height);
      });

      Neutralino.app.getConfig().then((c) => { document.getElementById('app_version').textContent = c.version; });

      // --- backend ---------------------------------------------------------------------------
      // spawnProcess replaces the environment with `envs`, so everything else is passed along.
      const baseEnv = await Neutralino.os.getEnvs();
      const appdir = baseEnv.APPDIR;
      const quote = (s) => `'${String(s).replace(/'/g, "'\\''")}'`;
      // On Linux the kernel kills the process if this one dies without cleaning up.
      const guarded = (cmd) => `if command -v setpriv >/dev/null 2>&1; then exec setpriv --pdeathsig KILL ${cmd}; else exec ${cmd}; fi`;
      const server = `${appdir}/usr/lib/audaxdm-server/audaxdm-server`;
      const backend = await Neutralino.os.spawnProcess(guarded(`${quote(server)} -A`), { envs: baseEnv });

      // --- main window -----------------------------------------------------------------------
      // A second process (Neutralino has one window per process): the same binary and resources,
      // started hidden, loading the backend. Once the application is mounted it shows itself and
      // prints 'mainReady' on its standard output, which arrives here; then the splash goes away.
      let mainProc = null;
      async function openMainWindow(url) {
        if (mainProc) return;
        const base = NL_ARGS.filter((a, i) => i === 0 || a.startsWith('--path=') || a === '--load-dir-res');
        const cmd = base.map(quote).join(' ') + ' --url=' + quote(url) + ' --window-title=' + quote('Audax Data Manager');
        mainProc = await Neutralino.os.spawnProcess(guarded(cmd), { envs: baseEnv });
      }

      // Output of both processes, split into lines.
      const pending = { stdOut: '', stdErr: '' };
      Neutralino.events.on('spawnedProcess', (e) => {
        const { id, action, data } = e.detail;
        if (mainProc && id === mainProc.id) {
          if (action === 'stdOut' && String(data).includes('mainReady')) Neutralino.window.hide();
          // The main window was closed: end the whole application (this also stops the backend).
          if (action === 'exit') Neutralino.app.exit();
          return;
        }
        if (id !== backend.id) return;
        if (action === 'exit') { addOutput('The server stopped (exit code ' + data + ').'); return; }
        if (action !== 'stdOut' && action !== 'stdErr') return;
        pending[action] += data;
        const lines = pending[action].split('\n');
        pending[action] = lines.pop();
        lines.forEach((raw) => {
          const line = raw.replace(/\r$/, '');
          onLine(action === 'stdErr' ? 'stderr' : 'stdout', line);
          if (action === 'stdOut' && line.startsWith('http')) openMainWindow(line.trim()).catch((err) => addOutput(String(err && err.message || err)));
        });
      });
    })().catch((err) => { document.body.textContent = 'Startup error: ' + (err && err.message || JSON.stringify(err)); });
    </script>
